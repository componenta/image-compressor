name: Compare performance

on:
  push:
    branches: ['refactor/image-processing-v2']
    paths:
      - '.github/workflows/benchmark-compare.yml'
      - 'benchmarks/**'
      - 'src/**'
      - 'composer.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IMAGE_BENCH_COMPARE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: v1.0.1
          path: .benchmark-baseline
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, exif
          coverage: none
          tools: composer:v2
      - name: Install candidate dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install baseline dependencies
        working-directory: .benchmark-baseline
        run: |
          composer require guzzlehttp/psr7:^3.6 --no-update --no-interaction
          composer install --no-dev --prefer-dist --no-interaction
      - name: Baseline v1.0.1
        env:
          IMAGE_BENCH_BASELINE: '1'
        run: |
          vendor/bin/phpbench run benchmarks/ImageCompressorBench.php --bootstrap=.benchmark-baseline/vendor/autoload.php --report=aggregate --iterations=3 --revs=1
      - name: Candidate v2
        env:
          IMAGE_BENCH_BASELINE: '0'
        run: |
          vendor/bin/phpbench run benchmarks/ImageCompressorBench.php --report=aggregate --iterations=3 --revs=1
      - name: Interleaved WebP and AVIF comparisons
        run: |
          set -euo pipefail
          for variant in webp-webp-1000x1000-bytes webp-webp-1000x1000-stream avif-avif-1000x1000-bytes avif-avif-1000x1000-stream; do
            for attempt in 1 2 3; do
              if [ "$attempt" = 2 ]; then
                order="candidate baseline"
              else
                order="baseline candidate"
              fi
              for version in $order; do
                echo "IMAGE_PAIRED_COMPARE $variant $attempt $version"
                if [ "$version" = baseline ]; then
                  IMAGE_BENCH_BASELINE=1 vendor/bin/phpbench run benchmarks/ImageCompressorBench.php --bootstrap=.benchmark-baseline/vendor/autoload.php --variant="$variant" --report=aggregate --iterations=3 --revs=1
                else
                  IMAGE_BENCH_BASELINE=0 vendor/bin/phpbench run benchmarks/ImageCompressorBench.php --variant="$variant" --report=aggregate --iterations=3 --revs=1
                fi
              done
            done
          done
